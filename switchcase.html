<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <style>
        .menu {
            text-align: center;
            padding: 20px;
            background-color: blanchedalmond;
            border-radius: 10px;
            width: 60%;
            margin: 0 auto;
        }
        li {
            list-style: none;
            text-align: left;
            font-size: large;
        }
    </style>
</head>
<body>
    <div class="menu">
        <h1>MENU</h1>
        <hr>
        <ul>
            <Li>1. Buah Naga</Li>
            <Li>2. Buah Kiwi</Li>
            <Li>3. Buah Epal</Li>
        </ul>

        <input type="number" id="pilihan" placeholder="Masukkan Nombor" min="1" max="3" required>
        <button onclick="pilihMenu()">Pilih</button>
        <p id="hasilPilihan"></p>

        <script src="switchcase.js"></script>
    </div>
</body>
</html>
